name: Limpeza de Tabelas Redundantes B3

on:
  workflow_dispatch: # Disparo manual com um clique

jobs:
  limpar-tabelas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar Dependências
        run: |
          pip install google-cloud-bigquery

      - name: 🗑️ Executar Exclusão das Tabelas Redundantes
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'project-1c5de651-f9e1-439e-854' }}
          DATASET_ID: 'B3'
        run: |
          python limpar_tabelas_redundantes.py
