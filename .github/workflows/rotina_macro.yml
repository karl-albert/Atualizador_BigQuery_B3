name: Rotina Atualizacao Macroeconomia BigQuery

on:
  schedule:
    # Executa todo sábado às 06:00 UTC (03:00 Brasília)
    - cron: '0 6 * * 6'
  workflow_dispatch: # Permite disparo manual via botão no GitHub

jobs:
  atualizar_macro_bigquery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl pyarrow google-cloud-bigquery google-cloud-bigquery-storage

      - name: Executar Atualizador de Macroeconomia
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'b3-brasil-bolsa-balcao' }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          DATASET_ID: ${{ secrets.DATASET_ID || 'B3' }}
        run: |
          python atualizar_macro.py
