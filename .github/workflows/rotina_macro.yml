name: Rotina Macroeconomia BigQuery

on:
  schedule:
    # Todo Sábado às 08:00 Horário de Brasília (11:00 UTC)
    - cron: '0 11 * * 6'
  workflow_dispatch: # Permite disparo manual a qualquer momento no GitHub Actions

jobs:
  atualizar-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Executar Atualização de Macroeconomia no BigQuery
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'b3-brasil-bolsa-balcao' }}
          DATASET_ID: 'B3'
        run: |
          python atualizar_macro.py
